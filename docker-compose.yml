services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: verysure
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
      POSTGRES_DB: verysure
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - verysure_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verysure -d verysure"]
      interval: 5s
      retries: 10
volumes:
  verysure_pg:
