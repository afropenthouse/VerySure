# Render Free with HTTPS email delivery, Paystack and database-backed photos.
# Apply environment changes to an existing manually configured service yourself.
services:
  - type: web
    name: verysure-api
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build:backend
    startCommand: npm run db:migrate && npm start --workspace backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: development
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:8081,http://localhost:8082,http://localhost:19006
      - key: SESSION_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: PHOTO_SIGNING_SECRET
        generateValue: true
      - key: OTP_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: OTP_FROM
        sync: false
      - key: PAYMENT_PROVIDER
        value: paystack
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: ALLOW_DEMO_PAYMENTS
        value: "false"
      - key: PHOTO_STORAGE
        value: database
      - key: SEED_PASSWORD
        generateValue: true
